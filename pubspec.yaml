name: ihk_app
description: "A new Flutter project."
publish_to: 'none'
# v13: Lernmodule-Redesign (Icons, Farben, Fortschrittsringe, Weiterlernen-
# Karte), Arena-Fixes (Absturz bei Rechen-Fragen behoben, faire Timer je
# Fragetyp: Reihenfolge/Luecken 60s, Freitext 120s), Ada als sichtbarer
# Knopf mit Text im Kursbereich
# Build 13 war in der Play Console schon verbraucht (Versionscodes sind
# app-weit einmalig, auch Entwuerfe zaehlen) -> direkt auf 14.
#
# v15 (1.5.1, 30.08.2026):
#  - Modul-Fortschritt kommt aus user_progress statt aus SharedPreferences.
#    Der alte Schluessel 'fortschritt_modul_<id>' wurde nie geschrieben, die
#    Modeluebersicht zeigte deshalb immer 0 von X.
#  - Datenschutzerklaerung Abschnitt 6: Anthropic und Groq statt nur Groq.
#    Gemini ist aus dem KI-Failover raus (Trainingsnutzung in der kostenlosen
#    Stufe).
#  - Pruefungen heissen "Uebungspruefung", Herkunftshinweis auf der
#    Detailseite, Markenhinweis bei den Zertifikaten.
#
# Achtung iOS: Die Build-Nummer hier steuert NICHT die TestFlight-Nummer.
# Die vergibt Codemagic (siehe "Build-Nummer bestimmen" in codemagic.yaml).
# Der App-Store-Versionsdatensatz muss aber zur Versionsnummer links vom +
# passen, sonst bietet App Store Connect den Build nicht zur Auswahl an.
version: 1.5.1+15
environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.7
  supabase_flutter: ^2.17.1
  shared_preferences: ^2.2.2
  http: ^1.6.0
  cupertino_icons: ^1.0.8
  audioplayers: ^6.0.0
  confetti: ^0.8.0
  google_generative_ai: ^0.4.7
  provider: ^6.1.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.2
  flutter_highlight: ^0.7.0
  flutter_markdown_plus: ^1.0.6
  app_links: ^7.2.1
  # Neue Play-Billing-Bibliothek (Google-Frist 31.08.2026 erfüllt)
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.2

  # SQL-Kurs: echte SQLite-Datenbank im Gerät
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24

  # Offizielles Store-Bewertungsfenster (Play In-App Review / App Store)
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Fuer den Screenshot-Workflow (App Store Bilder aus dem iOS-Simulator)
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  dotenv: ^4.2.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  sign_in_with_apple: ^6.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/anschluesse/labeled/
    - assets/anschluesse/quiz/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  # iOS braucht ein eigenes Quellbild: app_icon.png hat SCHWARZE abgerundete Ecken.
  # iOS legt die Maske selbst an -> das ergibt schwarze Raender im fertigen Icon.
  # app_icon_ios.png ist dieselbe Grafik als vollflaechiges Quadrat.
  # NICHT entfernen, sonst kommen die schwarzen Ecken zurueck.
  image_path_ios: "assets/icon/app_icon_ios.png"
  min_sdk_android: 21
  # App Store lehnt Icons mit Alpha-Kanal ab
  remove_alpha_ios: true