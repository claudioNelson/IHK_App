########################################################################
# Lernarena - Codemagic CI/CD
#
# WICHTIG: In diese Datei kommen NIEMALS Schluessel oder Passwoerter.
# Der App Store Connect API Key liegt ausschliesslich in Codemagic unter
#   Settings -> Integrations -> Developer Portal  (Name: "Lernarena API Key")
########################################################################

workflows:

  ####################################################################
  # 1) iOS Release -> TestFlight
  #    Signiert ueber App Store Connect API Key (automatic signing)
  ####################################################################
  ios-release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Name der Integration in Codemagic:
      # Settings -> Integrations -> Developer Portal -> Add key
      app_store_connect: Lernarena API Key

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      # ---- Secrets --------------------------------------------------
      # KEINE Secrets in dieser Datei und KEINE Variablengruppe noetig.
      # Die Integration oben stellt diese Variablen automatisch bereit:
      #   APP_STORE_CONNECT_ISSUER_ID
      #   APP_STORE_CONNECT_KEY_IDENTIFIER
      #   APP_STORE_CONNECT_PRIVATE_KEY

      vars:
        BUNDLE_ID: "app.lernarena"
        # Numerische Apple-ID der App aus App Store Connect (NICHT geheim).
        # Steht in der App-Store-Connect-URL: /apps/6748392017/...
        APP_STORE_APPLE_ID: "6748392017"

      # ---- Automatisches Code Signing -------------------------------
      # Codemagic erzeugt/holt Zertifikat + Provisioning Profile
      # ueber den App Store Connect API Key.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.lernarena

    cache:
      cache_paths:
        - ~/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-v*'
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Flutter-Abhaengigkeiten holen
        script: |
          flutter --version
          flutter pub get

      - name: Build-Nummer aus TestFlight hochzaehlen
        script: |
          # Verhindert "build number already used" beim Upload
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --warn-on-not-found || echo 0)
          if [ -z "$LATEST" ]; then LATEST=0; fi
          BUILD_NUMBER=$(($LATEST + 1))
          echo "Naechste Build-Nummer: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

      - name: CocoaPods installieren
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Xcode-Signing-Konfiguration anwenden
        script: |
          xcode-project use-profiles

      - name: Statische Analyse
        script: |
          flutter analyze --no-fatal-infos || true

      - name: IPA bauen
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Gruppe muss in App Store Connect existieren (TestFlight -> Interne Tests)
        beta_groups:
          - Internal Testers
        # Auf true setzen, sobald die App wirklich in den Store soll:
        submit_to_app_store: false

      email:
        recipients:
          - info@lernarena.app
        notify:
          success: true
          failure: true

  ####################################################################
  # 2) iOS Smoke-Build (unsigniert) - fuer schnelle Checks
  ####################################################################
  ios-unsigned:
    name: iOS Build (unsigniert, ohne Upload)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - ~/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Flutter-Abhaengigkeiten holen
        script: flutter pub get
      - name: Unsignierten Build erzeugen
        script: flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
