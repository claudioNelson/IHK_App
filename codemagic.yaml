########################################################################
# Lernarena - Codemagic CI/CD
#
# WICHTIG: In diese Datei kommen NIEMALS Schluessel oder Passwoerter.
#
# Code Signing laeuft AUTOMATISCH ueber den App Store Connect API Key:
# "app-store-connect fetch-signing-files ... --create" legt Zertifikat und
# Provisioning Profile bei Apple an, falls sie noch nicht existieren.
#
# Voraussetzungen in Codemagic:
#  1) Settings -> Integrations -> Developer Portal -> Add key
#     Name: "Lernarena API Key"  (liefert ISSUER_ID / KEY_IDENTIFIER / PRIVATE_KEY)
#  2) Environment variables -> Gruppe "appstore_credentials" mit EINER Variablen:
#     CERTIFICATE_PRIVATE_KEY  = RSA-Private-Key im PEM-Format, als "Secure"
#     (einmalig erzeugen; daraus baut Apple das Distributionszertifikat)
########################################################################

workflows:

  ####################################################################
  # 1) iOS Release -> TestFlight
  ####################################################################
  ios-release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Lernarena API Key

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      groups:
        - appstore_credentials     # enthaelt nur CERTIFICATE_PRIVATE_KEY

      vars:
        BUNDLE_ID: "app.lernarena"
        # Numerische Apple-ID der App aus App Store Connect (NICHT geheim).
        APP_STORE_APPLE_ID: "6748392017"

      # KEIN "ios_signing:" hier!
      # Das ist der manuelle Signing-Weg und vertraegt sich nicht mit
      # fetch-signing-files. Beides zusammen ergibt
      # "No matching profiles found for bundle identifier".

    cache:
      cache_paths:
        - ~/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-v*'
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Flutter-Abhaengigkeiten holen
        script: |
          flutter --version
          flutter pub get

      - name: CocoaPods installieren
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Keychain vorbereiten
        script: |
          keychain initialize

      - name: Zertifikat und Provisioning Profile holen bzw. anlegen
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Zertifikat in die Keychain legen
        script: |
          keychain add-certificates

      - name: Xcode-Projekt auf die Profile umstellen
        script: |
          xcode-project use-profiles

      - name: Build-Nummer aus TestFlight hochzaehlen
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --warn-on-not-found || echo 0)
          if [ -z "$LATEST" ]; then LATEST=0; fi
          BUILD_NUMBER=$(($LATEST + 1))
          echo "Naechste Build-Nummer: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

      - name: Statische Analyse
        script: |
          flutter analyze --no-fatal-infos || true

      - name: IPA bauen
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false

      email:
        recipients:
          - info@lernarena.app
        notify:
          success: true
          failure: true

  ####################################################################
  # 2) iOS Smoke-Build (unsigniert) - kein Signing, kein Upload
  ####################################################################
  ios-unsigned:
    name: iOS Build (unsigniert, ohne Upload)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - ~/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Flutter-Abhaengigkeiten holen
        script: flutter pub get
      - name: Unsignierten Build erzeugen
        script: flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
